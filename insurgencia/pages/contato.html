<h2>Contato</h2>
<div class="grade">
  <form id="form" class="painel" novalidate>
    <label for="nome">Nome</label>
    <input id="nome" name="nome" type="text" autocomplete="name">
    <p class="erro" id="erro-nome"></p>
    <label for="email">Seu e-mail</label>
    <input id="email" name="email" type="email" autocomplete="email">
    <p class="erro" id="erro-email"></p>
    <label for="mensagem">Mensagem</label>
    <textarea id="mensagem" name="mensagem" rows="5"></textarea>
    <p class="erro" id="erro-mensagem"></p>
    <button class="btn" type="submit">Enviar mensagem</button>
    <p id="form-ok" aria-live="polite"></p>
  </form>
  <div class="painel links">
    <h3>Outros canais</h3>

    <p><a href="https://www.linkedin.com/in/arthur-pierre-de-aguiar-7b756030a" target="_blank" rel="noopener"><span class="ico ico-linkedin"></span>LinkedIn</a></p>
    <p><a href="mailto:pinherrepeixe@gmail.com"><span class="ico ico-email"></span>pinherrepeixe@gmail.com</a></p>
  </div>
</div>
